name: Update Tickets (Excel)

on:
  schedule:
    # Morning / afternoon Excel backup (CST), after Mac 9:05 & 17:18
    - cron: "25 1 * * *"
    - cron: "35 9 * * *"
    # Hourly catch-up 09:35–17:35 when morning/afternoon slot still pending
    - cron: "35 1,2,3,4,5,6,7,8,9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sn-dashboard-tickets
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Databricks secrets
        run: |
          test -n "${{ secrets.DATABRICKS_SERVER_HOSTNAME }}" || { echo "Missing DATABRICKS_SERVER_HOSTNAME"; exit 1; }
          test -n "${{ secrets.DATABRICKS_HTTP_PATH }}" || { echo "Missing DATABRICKS_HTTP_PATH"; exit 1; }
          test -n "${{ secrets.DATABRICKS_TOKEN }}" || { echo "Missing DATABRICKS_TOKEN"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: automation
        run: pip install -r requirements-ci.txt

      - name: Refresh Excel ticket details from Databricks
        working-directory: automation
        env:
          CI: "true"
          PYTHONDONTWRITEBYTECODE: "1"
          DATABRICKS_SERVER_HOSTNAME: ${{ secrets.DATABRICKS_SERVER_HOSTNAME }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python run_dashboard.py --ci --excel-only --skip-if-fresh
