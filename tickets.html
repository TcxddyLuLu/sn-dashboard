<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SN Dashboard — Excel 明细</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 24px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  a { color: #38bdf8; }
  .nav { margin-bottom: 20px; font-size: 14px; }
  .card {
    background: linear-gradient(135deg, #1e3a5f 0%, #1e293b 100%);
    border-radius: 12px;
    padding: 28px 32px;
    box-shadow: 0 4px 24px rgba(0,0,0,.35);
  }
  h1 { font-size: 22px; margin-bottom: 8px; }
  .meta { font-size: 13px; opacity: .75; margin-bottom: 20px; line-height: 1.5; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
  select, button {
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(15,23,42,.6);
    color: #e2e8f0;
  }
  .btn-primary {
    background: #0d9488;
    border: none;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary:hover { background: #0f766e; }
  #staleBanner {
    display: none;
    background: #7f1d1d;
    color: #fecaca;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 13px;
  }
  #ticketCount { font-size: 13px; opacity: .8; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><a href="index.html">← 返回 Dashboard</a></div>
  <div id="staleBanner"></div>
  <div class="card">
    <h1>Excel 工单明细</h1>
    <div class="meta">
      <div>目标：每日上午、下午各更新一次（9:00 / 17:00 起，失败后自动补跑）</div>
      <div id="ticketsUpdatedTime">最近更新：—</div>
    </div>
    <div class="toolbar">
      <label>
        月份
        <select id="monthSelect"></select>
      </label>
      <button type="button" class="btn-primary" id="exportBtn">Export Excel</button>
    </div>
    <div id="ticketCount"></div>
  </div>
</div>
<script src="xlsx.full.min.js"></script>
<script src="tickets-features.js" defer></script>
</body>
</html>
