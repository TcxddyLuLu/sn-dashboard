<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
    padding: 24px;
  }
  .dashboard { max-width: 1200px; margin: 0 auto; }
  .nav { margin-bottom: 14px; font-size: 14px; }
  .nav a { color: #2563eb; text-decoration: none; }
  .nav a:hover { text-decoration: underline; }
  .header {
    background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
    color: #fff;
    padding: 28px 32px;
    border-radius: 16px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header h1 { font-size: 26px; font-weight: 700; }
  .header .meta { text-align: right; font-size: 14px; opacity: .9; }
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 18px 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .card .label {
    font-size: 12px;
    color: #64748b;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .card .value { font-size: 32px; font-weight: 700; margin-top: 2px; }
  .card.incident .value { color: #3b82f6; }
  .card.task .value { color: #f97316; }
  .card.total .value { color: #1e293b; }
  .card.days .value { color: #8b5cf6; }
  .section {
    background: #fff;
    border-radius: 12px;
    padding: 20px 24px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    margin-bottom: 20px;
  }
  .section h3 { font-size: 16px; margin-bottom: 12px; }
  .section .subhead { font-size: 12px; color: #64748b; margin-bottom: 14px; }
  .week-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .week-card {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 14px;
    text-align: center;
  }
  .week-card.current {
    border-color: #2563eb;
    background: #eff6ff;
    box-shadow: inset 0 -3px 0 #2563eb;
  }
  .wk-title { font-weight: 700; font-size: 15px; }
  .wk-range { font-size: 11px; color: #64748b; margin: 4px 0 8px; }
  .wk-stats .inc { color: #3b82f6; font-weight: 600; }
  .wk-stats .task { color: #f97316; font-weight: 600; }
  .wk-total { font-size: 13px; margin-top: 6px; font-weight: 600; }
  .sync-panel { overflow-x: auto; }
  .sync-grid {
    --day-w: 36px;
    --week-w: 46px;
    --label-w: 56px;
    --sum-w: 44px;
    display: grid;
    grid-template-columns: var(--label-w) max-content var(--sum-w);
    column-gap: 0;
    align-items: stretch;
    min-width: min-content;
  }
  .sync-label {
    font-size: 12px;
    font-weight: 600;
    color: #475569;
    display: flex;
    align-items: center;
    padding: 0 8px 0 0;
    background: #fff;
    position: sticky;
    left: 0;
    z-index: 2;
  }
  .sync-label.header { align-items: flex-end; padding-bottom: 6px; min-height: 44px; }
  .sync-sum {
    text-align: center;
    font-weight: 700;
    font-size: 12px;
    color: #1e293b;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    min-height: 30px;
  }
  .sync-sum.header {
    font-size: 15px;
    font-weight: 800;
    color: #0f172a;
    background: #cbd5e1;
    border-color: #94a3b8;
    min-height: 44px;
    align-self: stretch;
  }
  .sync-track {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: var(--block-gap, 10px);
  }
  .week-block {
    display: flex;
    flex-direction: column;
    border: 2px solid #cbd5e1;
    border-radius: 10px;
    background: linear-gradient(180deg, #f8fafc 0%, #fff 100%);
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    overflow: hidden;
    flex: 0 0 auto;
  }
  .week-block.current {
    border-color: #2563eb;
    box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.25);
  }
  .week-block.orphan {
    border-style: dashed;
    border-color: #e2e8f0;
    background: #fff;
  }
  .week-block-title {
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: #475569;
    padding: 6px 8px 4px;
    border-bottom: 1px solid #e2e8f0;
    background: rgba(248, 250, 252, 0.9);
    white-space: nowrap;
  }
  .week-block.current .week-block-title {
    color: #1d4ed8;
    background: #eff6ff;
  }
  .week-block-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
  .day-col {
    width: var(--day-w);
    flex: 0 0 var(--day-w);
    text-align: center;
    border-right: 1px solid #f1f5f9;
  }
  .day-col:last-child { border-right: none; }
  .day-col.head {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 0 2px;
    color: #334155;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
  }
  .day-col.head .sub { font-weight: 400; font-size: 10px; color: #64748b; display: block; }
  .day-col.head.weekend { opacity: 0.7; }
  .day-col.val { padding: 0; }
  .day-col.val .cell-inner {
    width: var(--day-w);
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 12px;
  }
  .day-col.val.weekend .cell-inner { color: #94a3b8; }
  .day-col.val.future .cell-inner { background: #f8fafc; color: #e2e8f0; }

    color: #ef4444;
    background: #fef2f2 !important;
  }
  .week-sum-col {
    width: var(--week-w);
    flex: 0 0 var(--week-w);
    border-left: 2px solid #94a3b8;
    background: #e2e8f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-weight: 700;
    font-size: 12px;
    color: #334155;
    padding: 4px 2px;
  }
  .week-sum-col .wk-h { font-size: 10px; color: #64748b; font-weight: 600; margin-top: 2px; }
  .week-sum-col.head {
    background: #cbd5e1;
    font-size: 11px;
    min-height: 44px;
  }
  .sync-chart-row {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: var(--label-w) max-content;
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px dashed #e2e8f0;
  }
  .sync-chart-area {
    position: relative;
    display: inline-block;
    min-height: var(--chart-h, 300px);
  }
  .sync-track.chart-track {
    visibility: hidden;
    pointer-events: none;
    position: absolute;
    height: 0;
    overflow: hidden;
  }
  .week-block.chart-mirror {
    border-color: transparent;
    box-shadow: none;
    background: transparent;
  }
  .week-block.chart-mirror .chart-pad { visibility: hidden; }
  .sync-chart-wrap {
    height: var(--chart-h, 300px);
    overflow: visible;
  }
  .sync-chart-wrap canvas { display: block; }
  @keyframes blink-warn {
    0%, 100% { opacity: 1; }

    color: #991b1b;
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 16px;
    font-size: 14px;
  }
